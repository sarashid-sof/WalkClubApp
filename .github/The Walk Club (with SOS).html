a.btn{display:block;text-align:center;text-decoration:none}a.btn.sm{display:inline-block}

let S={mode:'app',done:false,ob:0,name:'',campus:'University of Southern California (sample)',goal:8000,likes:[],perms:{steps:null,loc:null,notif:null},steps:3400,life:48300,pts:6200,cap:20000,capUsed:3400,off:false,q:0,tab:'home',loading:false,netErr:false,f:{c:'All',d:'Any',max:20000,now:false,near:false},view:'list',detail:null,sheet:null,codeId:null,codes:[],joined:false,anon:false,team:62400,toast:'',vmsg:'',muted:false,wm:false,tr:{on:false,p:[],err:''},pf:{standing:'Not set',grad:'',major:'',minor:'',goals:[],interests:[],hobbies:'',habits:[],vis:'Friends'},favs:[],share:true,ec:[],sosl:'',sosm:'',nut:{on:false,auto:true,kcal:true,share:false,log:[]},nv:false,dc:[],dbusy:false,biz:{name:'Your Restaurant (sample)',e:'🍪',c:'Café',desc:'Fresh baked goods and coffee near campus.'},pd:{oid:5,pkg:'Featured in Explore',weeks:1},fr:[{n:'Maya R.',today:8400,goal:8000,week:54200},{n:'Jordan K.',today:6100,goal:10000,week:48800},{n:'Priya S.',today:9900,goal:8000,week:45100}],cc:[{n:'Campus Walk Week 6',d:'Oct 26',b:'🥾'},{n:'First 5,000-step day',d:'Oct 3',b:'🌳'}],blocked:[],chat:[{id:1,w:'Maya R.',m:'Who’s in for the 100k push this week?'},{id:2,w:'Jordan K.',m:'Library loop after class? 🚶'}],

function ask(k){const m={steps:['Allow step access?','The Walk Club reads daily step totals from Apple Health or Health Connect. It does not read your heart rate, sleep, or location. (Simulated dialog: no real health data is connected.)'],loc:['Allow location while using the app?','Only used at redemption to check you are near the restaurant. Never used to earn points, and never shown to friends.'],notif:['Allow notifications?','Goal reminders and offers about to expire. You can turn these off any time.']}[k];

function addSteps(n,src){if(S.perms.steps!=='granted'){toast('Step access is off. Turn it on to earn points.');return}

if(S.off){S.q+=n;toast(`Offline: ${n} steps saved on this phone and will sync later`);return}

if(ok)S.tx.unshift({t:'earn',l:src==='late'?'Late sync (simulated)':'Walked (simulated)',p:ok,s:'Today'});

function goOnline(){S.off=false;const n=S.q;S.q=0;if(n)addSteps(n,'late');else render()}
const need=o=>Math.max(0,o.cost-S.pts);
function rnd(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return()=>(h=(h*1664525+1013904223)>>>0)/4294967296}

function redeem(id){const o=O(id);S.sheet=null;

function refund(c,why){c.st=why;const o=O(c.oid),t=S.tx.find(x=>x.cid===c.id);if(t)t.st='Refunded';S.pts+=o.cost;S.tx.unshift({t:'refund',l:`${o.r}: ${why==='expired'?'code expired':'restaurant could not honor'}`,p:o.cost,s:'Today'})}
function validate(){const v=$('#vc').value.trim().toUpperCase(),c=S.codes.find(x=>x.code===v);

function decline(){const v=$('#vc').value.trim().toUpperCase(),c=S.codes.find(x=>x.code===v);if(c&&c.st==='active'){refund(c,'declined');S.vmsg='Marked as not honored. Points returned to the student.'}else S.vmsg='Enter an active code first.';render()}

function hav(a,b){const R=6371000,r=x=>x*Math.PI/180,dl=r(b.la-a.la),dn=r(b.lo-a.lo),h=Math.sin(dl/2)**2+Math.cos(r(a.la))*Math.cos(r(b.la))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}

${bizCards()}<div class="card"><h3>Create offer</h3><div class="grid2"><label>Description<input id="nd" value="Free cookie with any drink"></label><label>Points<input id="np" type="number" value="4000"></label><label>Minimum purchase<input id="nm2" value="Any drink"></label><label>Redemption limit<input id="nl" type="number" value="100"></label></div><button class="btn sm" onclick="addOffer()">Publish offer (mock)</button></div></div>`}
function addOffer(){const id=Date.now();S.offers.push({id,r:S.biz.name,e:S.biz.e,c:S.biz.c,local:true,bd:S.biz.desc,d:$('#nd').value,cost:+$('#np').value||4000,exp:'Jan 31',min:$('#nm2').value||'None',ex:'None',loc:['Main Location'],dist:.2,diet:[],now:true,sp:false,x:120,y:90,imp:0,sav:0,red:0,lim:+$('#nl').value||100,paused:false});toast('Offer added; see it in the student app')}
const PLAN=[
['Value proposition','Students turn everyday steps into real food discounts and walk with friends. Restaurants reach local students at a cost they cap themselves.'],
['MVP (release 1)','Onboarding, step tracking and points ledger, offer discovery, server-checked QR redemption, friends/groups, opt-in weekly challenges, restaurant dashboard. Later: public group walks, direct messaging (need moderation), more campuses, richer analytics.'],
['Architecture','React Native with Expo (one codebase, native HealthKit and Health Connect modules via dev builds). Backend: Postgres + API (e.g. Supabase or Node). Append-only point_ledger with idempotency keys; step_batches(source, device, local_day, tz, count, dedupe_key); offers; redemptions(code_hash, expires_at, status); businesses, locations, staff roles. All authorization checked server-side.'],
['Steps and points rules','Earning starts when permission is granted (no backfill). Per local day, per hour bucket, credit only the increase over what was already credited, preferring one source, so a watch and a phone don’t double count. Offline batches queue with idempotency keys and sync up to 3 days late. Time zone is stored with each batch. Daily cap (e.g. 20,000 points) bounds cost; steps above it still count for goals.'],
['Redemption safety','Server checks eligibility, deducts points, issues a 5-minute single-use code. Staff validation marks it used. Expired or declined codes refund automatically. Network failures retry safely because requests are idempotent.'],
['Business model','Pilot: flat restaurant subscription (e.g. $99/location/month, assumption) with a redemption cap. Restaurants fund the discounts and choose offers, limits, and dates. Sponsored placements and sponsored campus challenges come later. No per-redemption fee in the pilot, to keep it simple. Identifiable fitness or location data is never sold.'],
['Illustrative unit economics (assumptions)','Offer: 10% off a $12 meal = $1.20 discount cost. If 80 redemptions/month, discounts cost the restaurant $96 plus $99 subscription. Value depends on whether redeemers are new or repeat customers, which the pilot must measure. Platform revenue with 15 locations: about $1,485/month before costs. All numbers are placeholders to validate.'],
['Fraud and privacy','Layered signals: duplicate records, manually entered steps where flagged by the OS, implausible totals, odd sync patterns, repeated redemption attempts. Responses: hold suspicious rewards, review, allow appeals. GPS is optional, only for redemption proximity, and is not proof of walking. Minimal data, deletion on request, secure sign-in.'],
['Pilot plan (8 weeks, one campus)','Weeks 1–2 recruit 10–15 restaurants and 100 students; weeks 3–8 run with weekly challenges. Metrics: step-permission opt-in, weekly active walkers, redemptions per offer, restaurant renewal intent, fraud-hold rate, 30-day retention, and a restaurant survey on new customers. Set targets after week-2 baseline.'],
['Emergency SOS','A persistent SOS button opens one-tap calling to emergency services, saved contacts (including a campus safety line the student adds), and a prefilled text that can include a one-time location link only if the student taps for it. Nothing is sent automatically; the phone’s own call and text apps do the sending. Production would add pilot-campus safety numbers, optional check-in timers and legal review.'],
['Needed before launch','Real HealthKit/Health Connect integration, backend and ledger, authentication, restaurant agreements, legal review of terms and promotions, moderation tools, accessibility testing, App Store/Play review.']];
function plan(){return`<div class="wide">${PLAN.map((p,i)=>`<details ${i<2?'open':''}><summary>${p[0]}</summary><p>${p[1]}</p></details>`).join('')}</div>`}
function render(){const m=S.mode;
$('#seg').innerHTML=[['app','Student app'],['biz','Restaurant dashboard'],['plan','Plan']].map(a=>`<button class="${m===a[0]?'on':''}" onclick="S.mode='${a[0]}';render()">${a[1]}</button>`).join('');
$('#note').textContent='Prototype: steps are simulated, offers and point costs are illustrative, and redemptions are mock. Brand names are real but none has agreed to participate. No health data or purchases are connected.';
const sc=document.querySelector('.scr'),pos=sc?sc.scrollTop:0;
$('#root').innerHTML=m==='app'?app():m==='biz'?biz():plan();
const n=document.querySelector('.scr');if(n&&S.mode==='app')n.scrollTop=pos}
render();
</script></body></html>
